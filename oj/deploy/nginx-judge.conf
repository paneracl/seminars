# /etc/nginx/sites-available/judge
# ln -s ../sites-available/judge /etc/nginx/sites-enabled/judge
#
# Written to sit alongside the existing CMS and Michanicos server blocks:
# a new server_name, a new upstream port, nothing touched in theirs.

upstream oj_app {
    server 127.0.0.1:8010 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name judge.cmscoinformatics.org;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name judge.cmscoinformatics.org;

    ssl_certificate     /etc/letsencrypt/live/judge.cmscoinformatics.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/judge.cmscoinformatics.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Source files and problem packages, not photos. 2 MB is generous for a
    # submission and small enough that an upload loop can't fill the disk.
    client_max_body_size 2m;

    access_log /var/log/nginx/judge.access.log;
    error_log  /var/log/nginx/judge.error.log;

    location /static/ {
        alias /srv/oj/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://oj_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django's SECURE_PROXY_SSL_HEADER trusts this. It is only safe
        # because nginx sets it here rather than passing a client header
        # through.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }
}
