{% load static %}
{% comment %}
CodeMirror editor, vendored (no CDN, no build step at runtime). It enhances
the existing <textarea id="id_source">; if the script fails to load, the
textarea is still a working plain editor and the form still submits. That
graceful-degradation is why the textarea stays in the DOM rather than being
replaced.
{% endcomment %}
<script src="{% static 'vendor/codemirror/codemirror.bundle.js' %}" defer></script>
<script id="lang-templates" type="application/json">{{ language_templates_json|safe }}</script>
<script defer>
document.addEventListener("DOMContentLoaded", function () {
  var textarea = document.getElementById("id_source");
  if (!textarea || !window.OJEditor) return;

  var langSelect = document.getElementById("id_language");
  var templates = {};
  try { templates = JSON.parse(document.getElementById("lang-templates").textContent); }
  catch (e) { templates = {}; }

  var currentLang = langSelect ? langSelect.value : "cpp17";
  var isDark = document.documentElement.getAttribute("data-theme") === "dark";

  // Seed an empty box with the language skeleton. If the student has already
  // typed something (e.g. after a failed submit re-render), keep it.
  if (!textarea.value.trim() && templates[currentLang]) {
    textarea.value = templates[currentLang];
  }

  // Hide the raw textarea; CodeMirror renders into a sibling container.
  var host = document.createElement("div");
  host.className = "cm-host";
  textarea.parentNode.insertBefore(host, textarea);
  textarea.style.display = "none";

  window.OJEditor.mount(host, textarea, currentLang, isDark);

  // Track whether the current buffer is an untouched template, so switching
  // language swaps the skeleton instead of stranding C++ boilerplate in a
  // Python submission — but never discards real work.
  function isPristineTemplate(val) {
    return Object.keys(templates).some(function (k) {
      return templates[k].trim() === val.trim();
    });
  }

  if (langSelect) {
    langSelect.addEventListener("change", function () {
      var next = langSelect.value;
      var current = window.OJEditor.getValue();
      window.OJEditor.setLanguage(next);
      if (isPristineTemplate(current) && templates[next]) {
        window.OJEditor.setValue(templates[next]);
        textarea.value = templates[next];
      }
    });
  }

  // React to the theme toggle firing elsewhere on the page.
  window.addEventListener("oj-theme-change", function (ev) {
    window.OJEditor.setDark(ev.detail.dark);
  });

  // --- Run Code -----------------------------------------------------------
  // Compile + run on the student's own input, ungraded. Reads the current
  // editor contents (via the synced textarea) and the language select, POSTs
  // to the panel's data-run-url, and renders stdout / stderr / status.
  var panel = document.querySelector(".run-panel");
  var runBtn = document.getElementById("run-btn");
  if (panel && runBtn) {
    var out = document.getElementById("run-output");
    var stdinEl = document.getElementById("run-stdin");
    var runUrl = panel.getAttribute("data-run-url");
    var form = textarea.closest("form");
    var csrf = form ? form.querySelector("[name=csrfmiddlewaretoken]") : null;

    function esc(s) {
      return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    var LABELS = {
      ok: ["Ran successfully", "ok"],
      compile_error: ["Compilation error", "bad"],
      runtime_error: ["Runtime error", "bad"],
      timeout: ["Time limit exceeded", "bad"],
      memory: ["Memory limit exceeded", "bad"],
      output_limit: ["Output limit exceeded", "bad"],
      rate_limited: ["Slow down", "warn"],
      error: ["Could not run", "warn"]
    };

    function render(d) {
      var meta = LABELS[d.status] || ["Done", ""];
      var html = '<div class="run-status ' + meta[1] + '">' + meta[0];
      if (d.status === "ok" && typeof d.cpu_time === "number") {
        html += ' <span class="run-time">' + d.cpu_time.toFixed(3) + ' s';
        if (d.memory_kb) html += ', ' + Math.round(d.memory_kb / 1024) + ' MB';
        html += '</span>';
      }
      html += '</div>';
      if (d.message) html += '<div class="run-msg">' + esc(d.message) + '</div>';
      if (d.compile_output) html += '<div class="run-label">Compiler output</div><pre>' + esc(d.compile_output) + '</pre>';
      if (d.status !== "compile_error") {
        html += '<div class="run-label">Output</div><pre>' + (d.stdout ? esc(d.stdout) : '<span class="run-empty">(no output)</span>') + (d.truncated ? '\n… (truncated)' : '') + '</pre>';
        if (d.stderr) html += '<div class="run-label">Errors (stderr)</div><pre>' + esc(d.stderr) + '</pre>';
      }
      out.innerHTML = html;
      out.hidden = false;
    }

    // The program runs on a judge worker, not in the web request, so a run
    // comes back "queued" and we poll until a worker has answered it.
    var RUN_WAIT_MS = 60000;
    function waitFor(url) {
      var deadline = Date.now() + RUN_WAIT_MS;
      return new Promise(function (resolve, reject) {
        (function tick() {
          fetch(url, { headers: { "Accept": "application/json" } })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d.status !== "queued") return resolve(d);
              if (Date.now() > deadline) {
                return resolve({ status: "error",
                  message: "The judge is busy or paused right now. Try again in a minute." });
              }
              setTimeout(tick, 700);
            })
            .catch(reject);
        })();
      });
    }

    runBtn.addEventListener("click", function () {
      textarea.value = window.OJEditor ? window.OJEditor.getValue() : textarea.value;
      var langSel = document.getElementById("id_language");
      var params = new URLSearchParams();
      params.set("source", textarea.value);
      params.set("language", langSel ? langSel.value : "cpp17");
      params.set("stdin", stdinEl ? stdinEl.value : "");

      runBtn.disabled = true;
      runBtn.textContent = "Running…";
      out.hidden = false;
      out.innerHTML = '<div class="run-status">Running…</div>';

      fetch(runUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-CSRFToken": csrf ? csrf.value : ""
        },
        body: params.toString()
      })
      .then(function (r) { return r.json(); })
      .then(function (d) { return d.status === "queued" ? waitFor(d.poll_url) : d; })
      .then(render)
      .catch(function () {
        out.innerHTML = '<div class="run-status warn">Could not reach the server. Try again.</div>';
      })
      .finally(function () {
        runBtn.disabled = false;
        runBtn.textContent = "Run code";
      });
    });
  }
});
</script>
