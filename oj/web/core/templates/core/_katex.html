{% load static %}
{% comment %}
KaTeX is vendored, not loaded from a CDN: a school LAN may have no outbound
internet, and a statement whose maths silently fails to render is worse than
one with no maths at all.
{% endcomment %}
<link rel="stylesheet" href="{% static 'vendor/katex/katex.min.css' %}">
<script defer src="{% static 'vendor/katex/katex.min.js' %}"></script>
<script defer src="{% static 'vendor/katex/auto-render.min.js' %}"></script>
<script defer>
  document.addEventListener("DOMContentLoaded", function () {
    var target = document.querySelector(".statement");
    if (!target || typeof renderMathInElement !== "function") return;
    renderMathInElement(target, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\[", right: "\\]", display: true},
        {left: "$",  right: "$",  display: false},
        {left: "\\(", right: "\\)", display: false}
      ],
      // A malformed formula shows as red source text rather than throwing and
      // leaving the rest of the statement unrendered.
      throwOnError: false,
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"]
    });
  });
</script>
